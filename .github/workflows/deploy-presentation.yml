name: Deploy Marp presentatie naar GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeer Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Genereer HTML
        run: |
          mkdir -p dist
          marp uitwerking/deelopdracht-10-presentatie/presentatie.md \
            --html \
            --allow-local-files \
            -o dist/index.html
          cp uitwerking/deelopdracht-10-presentatie/bg.svg dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
